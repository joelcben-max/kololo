<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תקציב חיה ויואל</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#db2777">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תקציב חיה ויואל">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#fff5f9;--cd:#fff;--tx:#2a1420;--mu:#8a6a79;--pk:#db2777;--pk2:#fff;--pkl:#fce7f3;--pkd:#9d174d;--g1:#be185d;--g2:#e11d74;--gt:#fff;--in:#15803d;--int:#fff;--inb:#dcfce7;--out:#dc2626;--outt:#fff;--outb:#fee2e2;--bd:#f5d5e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f16;--cd:#27171f;--tx:#fdf2f8;--mu:#c9a8b8;--pk:#f472b6;--pk2:#3b0a22;--pkl:#4a1630;--pkd:#fbcfe8;--g1:#f9a8d4;--g2:#f472b6;--gt:#3b0a22;--in:#4ade80;--int:#052e16;--inb:#10301c;--out:#f87171;--outt:#3b0a0a;--outb:#3a1618;--bd:#432535;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a0f16;--cd:#27171f;--tx:#fdf2f8;--mu:#c9a8b8;--pk:#f472b6;--pk2:#3b0a22;--pkl:#4a1630;--pkd:#fbcfe8;--g1:#f9a8d4;--g2:#f472b6;--gt:#3b0a22;--in:#4ade80;--int:#052e16;--inb:#10301c;--out:#f87171;--outt:#3b0a0a;--outb:#3a1618;--bd:#432535;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{max-width:560px;margin:0 auto;padding:12px 14px 110px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.m{position:relative;border-radius:22px;padding:16px 18px;margin-bottom:10px}
.m small{font-size:14px}
.m b{display:block;font-size:36px;font-weight:700;margin-top:2px}
.m1{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--gt);box-shadow:0 8px 20px rgba(219,39,119,.25)}
.m1 .neg{color:inherit}
.m2{background:var(--pkl);color:var(--pkd)}
.ed{position:absolute;top:14px;left:14px;border:1px solid currentColor;background:none;border-radius:10px;padding:4px 12px;font-size:13px;color:inherit}
.neg{color:var(--out)}
.seg{display:flex;gap:6px;background:var(--pkl);padding:4px;border-radius:16px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:12px;font-size:15px;color:var(--pkd)}
.seg button.on{background:var(--pk);color:var(--pk2);font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.nav button{width:46px;height:42px;border:1px solid var(--bd);background:var(--cd);border-radius:14px;font-size:24px;line-height:1;color:var(--pk)}
.nav strong{font-size:19px;color:var(--pkd)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:7px}
.row.in{border-inline-start:5px solid var(--in)}
.row.out{border-inline-start:5px solid var(--out)}
.row.pl{border-style:dashed;border-inline-start-style:solid}
.row .g{flex:1;min-width:0}
.row small,.em,.nm small{color:var(--mu);font-size:13px}
.am{font-weight:700;font-size:17px}
.in .am{color:var(--in)}
.out .am{color:var(--out)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--pkl)}
.in .ic{background:var(--inb)}
.out .ic{background:var(--outb)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mu);background:none;flex:none;color:var(--int);padding:0;font-size:16px}
.ck.on{background:var(--in);border-color:var(--in)}
.y{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center}
.y>*:not(:first-child){text-align:end}
.yh{background:none;border:0;padding:2px 12px}
.row.cur{border-color:var(--pk)}
.pp span{color:var(--in)}
.em{text-align:center;margin:30px 0}
.sm{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.sm.in{border-top:5px solid var(--in)}
.sm.out{border-top:5px solid var(--out)}
.hd,.r{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.hd{font-size:18px;border-bottom:1px solid var(--bd)}
.sm.in .hd b,.sm.in .r .am{color:var(--in)}
.sm.out .hd b,.sm.out .r .am{color:var(--out)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(532px,calc(100% - 28px));height:58px;border:0;border-radius:20px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--gt);font-size:19px;font-weight:700;box-shadow:0 8px 22px rgba(219,39,119,.35)}
#ov{position:fixed;inset:0;background:rgba(40,10,25,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#ov.on{display:flex}
.sh{--ty:var(--pk);--tt:var(--pk2);background:var(--cd);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}
.sh.in{--ty:var(--in);--tt:var(--int)}
.sh.out{--ty:var(--out);--tt:var(--outt)}
.sh .seg button.on{background:var(--ty);color:var(--tt)}
.sh input:not([type=checkbox]){width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:14px;padding:11px 12px;font-size:17px;margin:4px 0}
#amt,#bk{font-size:30px!important;font-weight:700;color:var(--ty)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.chips button{border:1px solid var(--bd);background:var(--bg);border-radius:14px;padding:12px 6px;font-size:16px}
.chips button.on{background:var(--ty);color:var(--tt);border-color:var(--ty);font-weight:700}
.rc{display:flex;align-items:center;gap:10px;margin:12px 2px;font-size:16px}
.rc input{width:22px;height:22px;accent-color:var(--pk)}
.nm{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--pkl);border-radius:14px;padding:10px 12px;margin-bottom:6px;color:var(--pkd)}
.nm input{width:80px!important;text-align:center}
.nm small{flex-basis:100%;color:var(--pkd)}
.bt{display:block;width:100%;border:0;border-radius:16px;background:var(--ty);color:var(--tt);font-size:18px;font-weight:700;padding:15px;margin-top:10px}
.bt:disabled{opacity:.35}
.bt.g{background:var(--pkl);color:var(--pkd)}
.bt.d{background:var(--out);color:var(--outt)}
.t{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--out);color:var(--outt);padding:10px 16px;border-radius:12px;z-index:9;display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.cal b{text-align:center;font-size:13px;color:var(--mu);padding:4px 0}
.dy{position:relative;height:46px;border:1px solid var(--bd);background:var(--cd);border-radius:12px;font-size:16px;padding:0}
.dy.td{border-color:var(--pk);color:var(--pk);font-weight:700}
.dy i{position:absolute;bottom:5px;left:50%;display:flex;gap:3px;transform:translateX(-50%)}
.dy i span{width:6px;height:6px;border-radius:50%;display:block}
.dy i .a{background:var(--in)}
.dy i .b{background:var(--out)}
.m-alert{background:linear-gradient(135deg,#b91c1c,#dc2626);color:#fff;box-shadow:0 8px 20px rgba(220,38,38,.3)}
.m-alert .neg,.good .neg,.bad .neg{color:inherit}
.alert-box{background:var(--outb);color:var(--out);border:1px solid var(--out);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tools button{border:1px solid var(--bd);background:var(--cd);border-radius:13px;padding:11px 7px;font-size:14px;color:var(--pkd)}
.progress{height:9px;background:var(--pkl);border-radius:99px;overflow:hidden;margin:7px 0 3px}
.progress span{display:block;height:100%;background:var(--in);border-radius:99px}
.progress.over span{background:var(--out)}
.muted{color:var(--mu);font-size:13px}
.searchbar{width:100%;border:1px solid var(--bd);background:var(--cd);border-radius:13px;padding:11px 12px;margin:5px 0 10px}
.statline{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.good{color:var(--in)}
.bad{color:var(--out)}
.hd .yh,.statline .yh{color:var(--pk)}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" onclick="openAdd()">＋ תנועה חדשה</button>
<div id="ov" onclick="cl()"></div>
<div class="t" id="t">שגיאה בסנכרון או בשמירת הנתונים</div>
<script>
const IN=['משכורת יואל','משכורת חיה','קצבת ילדים','נכות','אחר'],OUT=['סופר','סופר טוב','דלק','קפה / מסעדה','ילדים','חיה קבוע','בגדים ילדים','שונות'];
const IC={'משכורת יואל':'💼','משכורת חיה':'👩‍💼','קצבת ילדים':'👶','נכות':'🤝','אחר':'✨','סופר':'🛒','סופר טוב':'🥑','דלק':'⛽','קפה / מסעדה':'☕','ילדים':'🧸','חיה קבוע':'💖','בגדים ילדים':'👕','שונות':'🧾'};
const MN=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),T=()=>ymd(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
let tx=[],open0=0,db=null,mode='m',f={},editingId=null,searchTerm='',budgets={},minReserve=3000,goals=[],view={y:new Date().getFullYear(),m:new Date().getMonth()};
const LS='cashflow-secure-v3';
const KC={};
function getKey(pass){return KC[pass]||(KC[pass]=(async()=>{const e=new TextEncoder(),km=await crypto.subtle.importKey('raw',e.encode(pass),{name:'PBKDF2'},false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:e.encode('chaya-yoel-salt-v1'),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})())}
async function encData(text){const pass=localStorage.getItem('fcode')||'default';if(pass=='default')return text;
  try{const key=await getKey(pass),iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));
    return JSON.stringify({iv:btoa(String.fromCharCode(...iv)),data:btoa(String.fromCharCode(...new Uint8Array(c)))})}catch(e){return text}}
async function decData(raw){const pass=localStorage.getItem('fcode')||'default';if(pass=='default')return raw;
  try{const o=JSON.parse(raw);if(!o.iv||!o.data)return raw;const key=await getKey(pass),b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(o.iv)},key,b(o.data)))}catch(e){return null}}
function load(){try{const j=JSON.parse(localStorage.getItem(LS)||localStorage.getItem('cashflow-secure-v2')||localStorage.getItem('cashflow-v1')||'{}');tx=j.tx||[];open0=+j.open||0;budgets=j.budgets||{};minReserve=Number.isFinite(+j.minReserve)?+j.minReserve:3000;goals=j.goals||[]}catch(e){}}
function persist(){try{localStorage.setItem(LS,JSON.stringify({tx,open:open0,budgets,minReserve,goals}))}catch(e){}}
const ok=t=>t&&(t.type=='in'||t.type=='out')&&isFinite(t.amt)&&/^\d{4}-\d\d-\d\d$/.test(t.date)&&/^[a-z0-9]+$/.test(t.id)&&typeof t.cat=='string';
const sg=t=>t.type=='in'?t.amt:-t.amt;
const cashDate=t=>t.done?(t.actualDate||t.date):t.date;
const bank=()=>open0+tx.filter(t=>t.done&&cashDate(t)<=T()).reduce((a,t)=>a+sg(t),0);
const balanceAt=ds=>open0+tx.filter(t=>cashDate(t)<=ds).reduce((a,t)=>a+sg(t),0);
const fc=(y,m)=>open0+tx.filter(t=>cashDate(t)<=y+'-'+pad(m+1)+'-31').reduce((a,t)=>a+sg(t),0);
const inM=(y,m)=>tx.filter(t=>cashDate(t).slice(0,7)==y+'-'+pad(m+1));
const net=(y,m)=>inM(y,m).reduce((a,t)=>a+sg(t),0);
const fm=(n,p)=>'<span dir="ltr" class="'+(n<0?'neg':'')+'">'+(n<0?'−':p&&n>0?'+':'')+'₪'+Math.abs(n).toLocaleString('he-IL',{maximumFractionDigits:2})+'</span>';
function toast(){const t=$('#t');t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function put(list){
  for(const t of list){const i=tx.findIndex(x=>x.id==t.id);i<0?tx.push(t):tx[i]=t}persist();draw();
  if(db)await Promise.all(list.map(async t=>db.collection('tx').doc(t.id).set({payload:await encData(JSON.stringify(t))})));
}
async function del(ids){tx=tx.filter(t=>!ids.includes(t.id));persist();draw();if(db)await Promise.all(ids.map(id=>db.collection('tx').doc(id).delete()))}
async function saveSettings(){persist();draw();if(db)await db.doc('meta/settings').set({payload:await encData(JSON.stringify({open:open0,budgets,minReserve,goals}))})}
async function setOpen(v){open0=v;await saveSettings()}
function show(h,c=''){$('#ov').innerHTML='<div class="sh '+c+'" onclick="event.stopPropagation()">'+h+'</div>';$('#ov').className='on'}
function cl(){$('#ov').className=''}
function go(d){if(mode!='y'){let m=view.m+d,y=view.y;if(m<0){m=11;y--}if(m>11){m=0;y++}view={y,m}}else view.y+=d;draw()}
async function tog(id){const t=tx.find(x=>x.id==id);if(!t)return;const n={...t,done:!t.done};if(n.done)n.actualDate=T();else delete n.actualDate;try{await put([n])}catch(e){toast()}}
function act(id){const t=tx.find(x=>x.id==id);if(!t)return;
  show(`<p style="font-size:18px;margin:4px 0 8px"><b>${esc(t.note||t.cat)}</b> · ${fm(sg(t))}</p><button class="bt" onclick="editTx('${id}')">עריכת תנועה</button>${t.rid?`<button class="bt" onclick="editTx('${id}',1)">עריכה של כל הבאים בסדרה</button><button class="bt g" onclick="extend('${id}')">הארכת הוראת קבע ב־12 חודשים</button>`:''}<button class="bt d" onclick="rm('${id}',0)">מחיקה</button>${t.rid?`<button class="bt d" onclick="rm('${id}',1)">מחיקה גם של כל הבאים</button>`:''}<button class="bt g" onclick="cl()">ביטול</button>`)}
async function rm(id,all){const t=tx.find(x=>x.id==id);if(!t)return;cl();
  const ids=all?tx.filter(x=>x.rid==t.rid&&x.date>=t.date).map(x=>x.id):[id];try{await del(ids)}catch(e){toast()}}
function askBank(){show(`<p style="margin:4px 0">כמה יש כרגע בחשבון הבנק?</p><input id="bk" type="number" inputmode="decimal" value="${Math.round(bank()*100)/100}"><button class="bt" onclick="saveBank()">עדכון</button><button class="bt g" onclick="cl()">ביטול</button>`);$('#bk').select()}
async function saveBank(){const v=parseFloat($('#bk').value);if(!isFinite(v))return;cl();try{await setOpen(open0+v-bank())}catch(e){toast()}}
const nt=()=>f.type=='out'&&!f.done;
function openAdd(ds){editingId=null;editAll=false;f={type:'out',cat:'',done:true,rec:false,n:12,date:ds||T(),amt:'',note:''};if(f.date>T())f.done=false;renderForm();$('#amt').focus()}
function sf(k,v){f[k]=v;if(k=='done'&&v)f.actual=T();if(k=='type')f.cat='';if(k=='date'&&v>T())f.done=false;renderForm();if(k=='type')$('#amt').focus()}
const can=()=>+f.amt>0&&!!f.cat;
function chk(){$('#sv').disabled=!can()}
const pick=i=>{const c=(f.type=='in'?IN:OUT)[i];f.cat=f.cat==c?'':c;renderForm()};
function renderForm(){
  const cats=f.type=='in'?IN:OUT;
  show(`<div class="seg"><button class="${f.type=='out'?'on':''}" onclick="sf('type','out')">הוצאה</button><button class="${f.type=='in'?'on':''}" onclick="sf('type','in')">הכנסה</button></div>
<input id="amt" type="number" inputmode="decimal" placeholder="סכום ₪" value="${esc(f.amt)}" oninput="f.amt=this.value;chk()">
<input type="text" maxlength="60" placeholder="הערה (לא חובה)" value="${esc(f.note)}" oninput="f.note=this.value;chk()">
<div class="chips">${cats.map((c,i)=>`<button class="${f.cat==c?'on':''}" onclick="pick(${i})">${IC[c]||''} ${c}</button>`).join('')}</div>
<div class="seg"><button class="${f.done?'on':''}" onclick="sf('done',true)">כבר בוצע בבנק</button><button class="${f.done?'':'on'}" onclick="sf('done',false)">צפי / עתידי</button></div>
<label class="muted">${editingId?'תאריך מתוכנן':'תאריך'}</label><input type="date" value="${f.date}" onchange="if(this.value)sf('date',this.value)">${editingId&&f.done?`<label class="muted">תאריך ביצוע בפועל</label><input type="date" value="${esc(f.actual||'')}" onchange="f.actual=this.value">`:''}
<label class="rc" style="${editingId?'display:none':''}"><input type="checkbox" ${f.rec?'checked':''} onchange="f.rec=this.checked;renderForm()">הוראת קבע / קבוע</label>
${f.rec?`<div class="nm"><span>חוזר על עצמו</span><input type="number" inputmode="numeric" min="2" max="60" value="${f.n}" oninput="f.n=this.value"><span>פעמים</span><small>פעם בחודש, כולל הפעם הראשונה</small></div>`:''}
${editAll?'<p class="muted">הסכום, הקטגוריה וההערה ישונו בכל החודשים הבאים בסדרה. התאריך והסטטוס ישתנו רק בתנועה הזו.</p>':''}${f.wid?'<p class="muted">שבוע בתקציב חודשי: שינוי הסכום יחשב מחדש את שאר השבועות.</p>':''}<button class="bt" id="sv" onclick="save()" ${can()?'':'disabled'}>שמירה</button>`,f.type)}
async function save(){
  if(!can())return;
  const a=+f.amt,note=String(f.note||'').trim(),n=f.rec&&!editingId?Math.max(1,Math.min(60,parseInt(f.n)||1)):1,rid=n>1?uid():'',[y,m,d]=f.date.split('-').map(Number),list=[];
  if(editingId){const old=tx.find(t=>t.id===editingId);if(!old)return;const u={...old,type:f.type,cat:f.cat,amt:a,date:f.date,done:!!f.done,note};
    if(u.done)u.actualDate=/^\d{4}-\d\d-\d\d$/.test(f.actual||'')?f.actual:T();else delete u.actualDate;
    if(u.wid&&a!=old.amt)u.wfix=true;
    let out=[u];
    if(editAll&&old.rid)out=tx.filter(t=>t.rid==old.rid&&t.date>=old.date&&t.id!=old.id).map(t=>({...t,type:f.type,cat:f.cat,amt:a,note})).concat(u);
    else if(u.wid)out=rebal(tx.filter(t=>t.wid==u.wid).map(t=>t.id==u.id?u:t));
    cl();editingId=null;editAll=false;view={y,m:m-1};try{await put(out)}catch(e){toast()}return}
  for(let i=0;i<n;i++){const dt=new Date(y,m-1+i,1),dim=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();

      const ps=inM(py,pm).filter(t=>t.type=='out'&&t.done&&t.cat==c&&+cashDate(t).slice(8,10)<=lim).reduce((a,t)=>a+t.amt,0);if(ps>0)pv.push(ps)}
    if(pv.length>=2){const avg=pv.reduce((a,b)=>a+b,0)/pv.length;if(sums[c]>avg*1.35&&sums[c]>300)warn.push(`חריגה בקטגוריה <b>${esc(c)}</b>: ₪${Math.round(sums[c])} לעומת ממוצע של ₪${Math.round(avg)}`)}}
  return(warn.length?`<div class="alert-box">⚠️ <b>ניטור חריגות:</b><br>${warn.join('<br>')}</div>`:'')+`<button class="bt g" onclick="openSimulator()" style="margin-bottom:10px">🧪 סימולציית “מה קורה אם...”</button>`}
function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{const fl=inp.files[0];if(!fl)return;try{const j=JSON.parse(await fl.text()),L=(j.tx||[]).map(t=>({...t,amt:Number(t.amt)||0})).filter(ok);if(!L.length&&!j.budgets)throw 0;
    show(`<h3>שחזור מגיבוי</h3><p>נמצאו ${L.length} תנועות. הן יתווספו או יעודכנו לפי המזהה שלהן. תנועות קיימות אחרות לא יימחקו.</p><button class="bt" id="rb">שחזור</button><button class="bt g" onclick="cl()">ביטול</button>`);
    $('#rb').onclick=async()=>{cl();if(j.open!=null)open0=Number(j.open)||0;if(j.budgets&&typeof j.budgets=='object')budgets=j.budgets;if(Number.isFinite(Number(j.minReserve)))minReserve=Number(j.minReserve);if(Array.isArray(j.goals))goals=j.goals;try{await put(L);await saveSettings()}catch(e){toast()}}
  }catch(e){toast()}};inp.click()}
function toolsHTML(){return `<div class="tools"><button onclick="openWeekly()">תקציב שבועי</button><button onclick="openBudgets()">תקציבים</button><button onclick="openReserve()">רף יתרה בטוחה</button><button onclick="openGoals()">יעדי חיסכון</button><button onclick="openForecast(30)">תחזית 30 יום</button><button onclick="openForecast(90)">תחזית 90 יום</button><button onclick="exportCSV()">ייצוא CSV</button><button onclick="exportBackup()">גיבוי מלא</button><button onclick="importBackup()">שחזור מגיבוי</button></div>`}
function editTx(id,all){const t=tx.find(x=>x.id===id);if(!t)return;editingId=id;editAll=!!all;f={type:t.type,cat:t.cat,done:!!t.done,rec:false,n:12,date:t.date,amt:String(t.amt),note:t.note||'',wid:t.wid,actual:t.done?(t.actualDate||t.date):T()};renderForm()}
function draw(){
  const n=new Date(),cur=view.y==n.getFullYear()&&view.m==n.getMonth();
  const tab=(k,l)=>`<button class="${mode==k?'on':''}" onclick="mode='${k}';draw()">${l}</button>`;
  let h=`<div class="m m1"><small>יש עכשיו בבנק</small><button class="ed" onclick="askBank()">עדכון</button><b>${fm(bank())}</b></div>
<div class="m m2"><small>צפי לסוף ${cur?'החודש':MN[view.m]+' '+view.y}</small><b>${fm(fc(view.y,view.m))}</b></div>
${reserveAlertHTML()}
<div class="seg">${tab('m','חודש')}${tab('s','סיכום')}${tab('y','שנה')}</div>
<div class="nav"><button onclick="go(-1)" aria-label="הקודם">›</button><strong>${mode!='y'?MN[view.m]+' '+view.y:view.y}</strong><button onclick="go(1)" aria-label="הבא">‹</button></div>`;
  if(mode=='m'){
    h+=getAnalysisHTML(view.y,view.m)+`<input class="searchbar" type="search" placeholder="חיפוש לפי קטגוריה, הערה או סכום" value="${esc(searchTerm)}" oninput="searchTerm=this.value;$('#lst').innerHTML=listHTML()">`+cal()+'<div id="lst">'+listHTML()+'</div>';
  }else if(mode=='s')h+=sum();
  else{
    h+='<div class="row yh y"><span></span><small>שינוי בחודש</small><small>צפי לסוף החודש</small></div>';
    for(let i=0;i<12;i++){const v=net(view.y,i);h+=`<button class="row y ${view.y==n.getFullYear()&&i==n.getMonth()?'cur':''}" onclick="view.m=${i};mode='m';draw()"><b>${MN[i]}</b><span class="${v>0?'pp':''}">${fm(v,1)}</span><b>${fm(fc(view.y,i))}</b></button>`}
  }
  $('#app').innerHTML=h+`<p class="em">${syncLabel()}${window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey?'<br><button class="ed" style="position:static;margin-top:6px" onclick="askCode()">🔑 קוד סנכרון</button>':''}</p>`;
}
load();draw();
(async()=>{try{
  const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey||!window.firebase)return;
  const code=localStorage.getItem('fcode');if(!code){askCode();return}
  firebase.initializeApp(cfg);await firebase.auth().signInAnonymously();
  const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  const b='families/'+code+'/';
  const c=db={collection:p=>fs.collection(b+p),doc:p=>fs.doc(b+p)};
  c.collection('tx').onSnapshot(async q=>{
    syncState=q.metadata.hasPendingWrites?'pending':'ok';const L=[];
    for(const d of q.docs){const o=d.data();let t=null;
      if(o.payload){const p=await decData(o.payload);if(p){try{t=JSON.parse(p)}catch(e){}}}else t=o;
      if(t){t={...t,id:d.id,amt:Number(t.amt)||0,note:String(t.note||'').slice(0,60)};if(ok(t))L.push(t)}}
    tx=L;persist();draw()},()=>{});
  c.doc('meta/settings').onSnapshot(async s=>{
    let o=s.data();if(!o)return;
    if(o.payload){const p=await decData(o.payload);try{o=JSON.parse(p)}catch(e){return}if(!o)return}
    else if(typeof o.b=='string'){try{o={...o,budgets:JSON.parse(o.b)}}catch(e){}}
    open0=Number(o.open)||0;if(o.budgets&&typeof o.budgets=='object')budgets=o.budgets;if(Number.isFinite(Number(o.minReserve)))minReserve=Number(o.minReserve);if(Array.isArray(o.goals))goals=o.goals;persist();draw()},()=>{});
}catch(e){db=null}})();
function askCode(){show(`<p style="margin:4px 0">קוד סנכרון משפחתי – גם מצפין את הנתונים. אותו קוד בשני הטלפונים (לפחות 6 תווים, עדיף ארוך)</p><input id="fc" type="password" maxlength="40" value="${esc(localStorage.getItem('fcode')||'')}"><label class="rc"><input type="checkbox" onchange="$('#fc').type=this.checked?'text':'password'">הצג קוד</label><button class="bt" onclick="saveCode()">שמירה</button><button class="bt g" onclick="cl()">ביטול</button>`)}
function saveCode(){const v=$('#fc').value.trim();if(v.length<6)return;try{localStorage.setItem('fcode',v)}catch(e){}location.reload()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
